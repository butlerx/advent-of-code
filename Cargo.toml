[workspace]
resolver = "3"
# Listed explicitly: dependabot can't expand globs in workspace members.
# Add each new year here.
members  = [
  "2018",
  "2019",
  "2020",
  "2021",
  "2022",
  "2023",
  "2024",
  "2025",
  "aoc_shared",
  "systems_check",
]

[workspace.package]
version    = "0.1.0"
authors    = ["butlerx <butlerx@notthe.cloud>"]
edition    = "2024"
repository = "http://github.com/butlerx/advent-of-code"

[workspace.dependencies]
aoc_shared = { path = "./aoc_shared" }

[workspace.lints.clippy]
all              = { level = "warn", priority = -1 }
assert_is_empty  = "allow"
mod_module_files = "warn"
pedantic         = { level = "warn", priority = -1 }
perf             = { level = "deny", priority = -1 }
unwrap_used      = "warn"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

# Several solutions (e.g. 2021 day 24, 2023 day 21) take a minute or more
# unoptimised; tests run against the real puzzle inputs.
[profile.test]
opt-level = 3

[workspace]
resolver = "3"
members  = ["20[0-9]*", "aoc_shared", "systems_check"]

[workspace.package]
version     = "0.1.0"
authors     = ["butlerx <butlerx@notthe.cloud>"]
edition     = "2024"
description = "Advent of Code solutions in Rust"
readme      = "README.md"
repository  = "http://github.com/butlerx/advent-of-code"

[workspace.dependencies]
aoc_shared = { path = "./aoc_shared" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

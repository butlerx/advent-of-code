[workspace]
resolver = "3"
# Listed explicitly: dependabot can't expand globs in workspace members.
# Add each new year here.
members  = [
  "2018",
  "2019",
  "2020",
  "2021",
  "2022",
  "2023",
  "2024",
  "2025",
  "aoc_shared",
  "systems_check",
]

[workspace.package]
version     = "0.1.0"
authors     = ["butlerx <butlerx@notthe.cloud>"]
edition     = "2024"
description = "Advent of Code solutions in Rust"
readme      = "README.md"
repository  = "http://github.com/butlerx/advent-of-code"

[workspace.dependencies]
aoc_shared = { path = "./aoc_shared" }

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf     = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
